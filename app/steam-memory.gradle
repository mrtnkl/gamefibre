import org.gradle.api.artifacts.transform.TransformAction
import org.gradle.api.artifacts.transform.TransformParameters
import org.gradle.api.artifacts.transform.TransformOutputs
import org.gradle.api.artifacts.transform.InputArtifact
import org.gradle.api.attributes.Attribute
import org.gradle.api.artifacts.type.ArtifactTypeDefinition
import org.gradle.api.file.FileSystemLocation
import org.gradle.api.provider.Provider
import org.gradle.api.tasks.PathSensitive
import org.gradle.api.tasks.PathSensitivity
import java.util.zip.ZipFile
import java.util.zip.ZipOutputStream
import java.util.zip.ZipEntry

// Replace only JavaSteam's VZip buffer policy with the MIT-derived source in app/.
// Preserve the pinned library and all of its normal transitive dependencies.
abstract class SteamWithoutVZip implements TransformAction<TransformParameters.None> {
    @InputArtifact
    @PathSensitive(PathSensitivity.NAME_ONLY)
    abstract Provider<FileSystemLocation> getInputArtifact()

    void transform(TransformOutputs outputs) {
        def input = inputArtifact.get().asFile
        def output = outputs.file(input.name)
        new ZipFile(input).withCloseable { source ->
            new ZipOutputStream(new FileOutputStream(output)).withCloseable { target ->
                source.entries().each { entry ->
                    if (entry.name != 'in/dragonbra/javasteam/util/VZipUtil.class') {
                        target.putNextEntry(new ZipEntry(entry.name))
                        if (!entry.directory) source.getInputStream(entry).withCloseable { it.transferTo(target) }
                        target.closeEntry()
                    }
                }
            }
        }
    }
}

def boundedVZip = Attribute.of('com.gamefibre.bounded-vzip', Boolean)
dependencies {
    attributesSchema { attribute(boundedVZip) }
    artifactTypes.getByName('jar') { attributes.attribute(boundedVZip, false) }
    registerTransform(SteamWithoutVZip) {
        from.attribute(boundedVZip, false).attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, 'jar')
        to.attribute(boundedVZip, true).attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, 'jar')
    }
}
configurations.configureEach { attributes.attribute(boundedVZip, true) }
