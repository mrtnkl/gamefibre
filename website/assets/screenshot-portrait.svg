<svg
  xmlns="http://www.w3.org/2000/svg"
  width="360"
  height="720"
  viewBox="0 0 360 720"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Portrait library placeholder</title>
  <desc id="desc">
    Illustrative GameFibre library with fictional games, search above list
    pills, and completion times on covers.
  </desc>
  <defs>
    <linearGradient id="space" x2="0.8" y2="1">
      <stop stop-color="#162c55" />
      <stop offset="1" stop-color="#607b9b" />
    </linearGradient>
    <linearGradient id="forest" x2="0" y2="1">
      <stop stop-color="#98baae" />
      <stop offset="1" stop-color="#183e3b" />
    </linearGradient>
    <linearGradient id="sun" x2="0" y2="1">
      <stop stop-color="#eed3a7" />
      <stop offset="1" stop-color="#bc7559" />
    </linearGradient>
    <linearGradient id="sea" x2="0.7" y2="1">
      <stop stop-color="#6ab8c7" />
      <stop offset="1" stop-color="#254969" />
    </linearGradient>
    <clipPath id="cover"><rect width="150" height="210" rx="8" /></clipPath>
    <symbol id="lunar" viewBox="0 0 150 210">
      <g clip-path="url(#cover)">
        <path fill="url(#space)" d="M0 0h150v210H0z" />
        <circle cx="104" cy="56" r="33" fill="#d6e5eb" />
        <circle cx="94" cy="48" r="7" fill="#bacfd8" />
        <circle cx="114" cy="66" r="10" fill="#bacfd8" />
        <path d="m-12 150 59-64 60 83 32-51 35 92H0" fill="#30465f" />
        <path d="m-10 184 70-54 111 80H0" fill="#132d48" />
        <path
          d="m33 54 2 2m-9 23 1 1m43-52 1 1m57 69 1 1"
          stroke="#fff"
          stroke-width="2"
        />
        <text
          x="14"
          y="168"
          fill="#fff"
          font-size="18"
          font-weight="600"
          letter-spacing="1"
        >
          LUNAR
        </text>
        <text x="14" y="188" fill="#fff" font-size="18" letter-spacing="3">
          DRIFT
        </text>
      </g>
    </symbol>
    <symbol id="wildwood" viewBox="0 0 150 210">
      <g clip-path="url(#cover)">
        <path fill="url(#forest)" d="M0 0h150v210H0z" />
        <circle cx="91" cy="54" r="28" fill="#dee7c7" />
        <path
          d="m-10 156 40-96 38 96m-23 12 36-104 43 104m-14 0 32-111 39 111"
          fill="#33594a"
        />
        <path
          d="m-10 210 39-111 43 111m-15 0 40-110 39 110m-12 0 28-84 33 84"
          fill="#1a3e36"
        />
        <path d="m72 210 4-33 13-24-3 30 15 27" fill="#a5c1a3" />
        <text
          x="75"
          y="64"
          text-anchor="middle"
          fill="#183e3b"
          font-size="16"
          font-weight="600"
          letter-spacing="1"
        >
          WILDWOOD
        </text>
      </g>
    </symbol>
    <symbol id="sunward" viewBox="0 0 150 210">
      <g clip-path="url(#cover)">
        <path fill="url(#sun)" d="M0 0h150v210H0z" />
        <circle cx="96" cy="76" r="30" fill="#fff0c5" />
        <path d="M0 136q45-36 91 1t70-2v75H0" fill="#cf9672" />
        <path d="M0 176q50-55 100-22t60-3v59H0" fill="#a96c55" />
        <path d="M0 195q50-32 100-10t60-1v26H0" fill="#805341" />
        <text
          x="75"
          y="47"
          text-anchor="middle"
          fill="#6e4938"
          font-size="19"
          letter-spacing="1"
        >
          SUNWARD
        </text>
        <path
          d="m55 150 6-17 6 17m-6-17v27"
          stroke="#644338"
          stroke-width="2"
        />
      </g>
    </symbol>
    <symbol id="deepblue" viewBox="0 0 150 210">
      <g clip-path="url(#cover)">
        <path fill="url(#sea)" d="M0 0h150v210H0z" />
        <path
          d="m40 0 20 150L95 0m8 0 2 110L135 0"
          fill="#b2e2e4"
          opacity=".2"
        />
        <path d="M0 180q30-50 45-20t35-3 70-17v70H0" fill="#18485a" />
        <path d="m46 87 21-8 15 8-15 8z" fill="#d2eff0" />
        <path d="m81 106 21-7 15 7-15 7z" fill="#d2eff0" />
        <text x="15" y="40" fill="white" font-size="17" letter-spacing="1">
          DEEP BLUE
        </text>
      </g>
    </symbol>
  </defs>
  <style>
    text {
      font-family: Arial, sans-serif;
    }
    .ink {
      fill: #202124;
    }
    .muted {
      fill: #5f6368;
    }
    .blue {
      fill: #0b57d0;
    }
  </style>
  <rect width="360" height="720" rx="24" fill="white" />
  <text x="24" y="27" font-size="11" class="ink">9:41</text>
  <path d="M303 20h4m4-3h4m4-3h4" stroke="#202124" stroke-width="3" />
  <rect x="330" y="14" width="14" height="8" rx="2" fill="#202124" />
  <path d="M21 61h19m-19 6h19m-19 6h19" stroke="#202124" stroke-width="1.8" />
  <text x="56" y="73" font-size="23" class="ink">GameFibre</text>
  <g fill="#5f6368">
    <circle cx="332" cy="60" r="2" />
    <circle cx="332" cy="67" r="2" />
    <circle cx="332" cy="74" r="2" />
  </g>
  <rect x="16" y="99" width="328" height="46" rx="23" fill="#f0f4f9" />
  <circle
    cx="39"
    cy="120"
    r="6"
    fill="none"
    stroke="#5f6368"
    stroke-width="1.8"
  />
  <path d="m44 125 5 5" stroke="#5f6368" stroke-width="1.8" />
  <text x="62" y="127" font-size="13" class="muted">Search your games</text>
  <text x="321" y="127" text-anchor="end" font-size="12" class="muted">4</text>
  <rect x="16" y="161" width="92" height="34" rx="17" fill="#e8f0fe" />
  <text x="62" y="183" font-size="12" text-anchor="middle" class="blue">
    ✓ All games
  </text>
  <rect
    x="116"
    y="161"
    width="91"
    height="34"
    rx="17"
    fill="white"
    stroke="#dce3ed"
  />
  <text x="161" y="183" font-size="12" text-anchor="middle" class="muted">
    Play next
  </text>
  <rect
    x="215"
    y="161"
    width="111"
    height="34"
    rx="17"
    fill="white"
    stroke="#dce3ed"
  />
  <text x="270" y="183" font-size="12" text-anchor="middle" class="muted">
    Weekend
  </text>
  <use href="#lunar" x="16" y="215" width="158" height="221" />
  <use href="#wildwood" x="186" y="215" width="158" height="221" />
  <rect x="121" y="409" width="44" height="20" rx="10" fill="white" />
  <text x="143" y="423" text-anchor="middle" font-size="10" class="blue">
    12 h
  </text>
  <rect x="291" y="409" width="44" height="20" rx="10" fill="white" />
  <text x="313" y="423" text-anchor="middle" font-size="10" class="blue">
    8 h
  </text>
  <use href="#sunward" x="16" y="448" width="158" height="221" />
  <use href="#deepblue" x="186" y="448" width="158" height="221" />
  <rect x="121" y="641" width="44" height="20" rx="10" fill="white" />
  <text x="143" y="655" text-anchor="middle" font-size="10" class="blue">
    6 h
  </text>
  <rect x="291" y="641" width="44" height="20" rx="10" fill="white" />
  <text x="313" y="655" text-anchor="middle" font-size="10" class="blue">
    4 h
  </text>
  <rect x="130" y="703" width="100" height="4" rx="2" fill="#202124" />
</svg>
